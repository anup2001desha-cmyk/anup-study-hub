<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#667eea">
<title>Anup Study Hub | मृदा Quiz</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  color:#172033; min-height:100vh;
}
.header{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;padding:18px 16px;text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.15);
}
.header h1{font-size:24px;margin-bottom:5px}
.header p{font-size:14px;opacity:.9}
.container{max-width:760px;margin:25px auto;padding:0 15px}
.card{
  background:white;border-radius:22px;padding:22px;
  box-shadow:0 8px 30px rgba(30,41,59,.12);
}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.badge{background:#eef2ff;color:#4f46e5;padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}
.progress{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:12px 0 22px}
.progress div{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:.3s}
.question{font-size:21px;line-height:1.55;font-weight:700;margin-bottom:20px}
.options{display:grid;gap:12px}
.option{
  width:100%;text-align:left;padding:15px 16px;border:2px solid #e5e7eb;
  border-radius:14px;background:#fff;font-size:16px;cursor:pointer;
  transition:.2s;line-height:1.45;
}
.option:hover{border-color:#667eea;background:#f5f7ff}
.option.correct{border-color:#16a34a;background:#dcfce7;color:#166534}
.option.wrong{border-color:#dc2626;background:#fee2e2;color:#991b1b}
.option.disabled{cursor:default}
.explanation{
  display:none;margin-top:17px;padding:14px 15px;border-radius:14px;
  background:#f8fafc;border-left:5px solid #667eea;
  line-height:1.6;font-size:15px;
}
.actions{display:flex;gap:10px;margin-top:20px}
button.action{
  flex:1;border:0;border-radius:14px;padding:14px;
  font-size:16px;font-weight:700;cursor:pointer;
}
#nextBtn{background:#667eea;color:white;display:none}
#nextBtn:hover{background:#5568d9}
#restartBtn{background:#172033;color:white}
.result{text-align:center;display:none}
.result .score{font-size:48px;font-weight:800;color:#667eea;margin:12px 0}
.result h2{font-size:26px;margin-bottom:8px}
.result p{line-height:1.6;color:#475569}
.note{margin-top:15px;text-align:center;font-size:12px;color:#64748b}
@media(max-width:520px){
 .card{padding:17px;border-radius:18px}
 .question{font-size:18px}
 .option{font-size:15px;padding:13px}
 .header h1{font-size:21px}
}
</style>
</head>

<body>
<header class="header">
  <h1>📚 Anup Study Hub</h1>
  <p>मृदा (Soil) — Interactive MCQ Quiz</p>
</header>

<main class="container">
  <section class="card" id="quizCard">
    <div class="topbar">
      <span class="badge" id="count">प्रश्न 1 / 45</span>
      <span id="scoreText">स्कोर: 0</span>
    </div>

    <div class="progress"><div id="progressBar"></div></div>

    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation"></div>

    <div class="actions">
      <button class="action" id="nextBtn" onclick="nextQuestion()">अगला प्रश्न ➜</button>
    </div>

    <div class="note">यह क्विज़ आपके भेजे गए मृदा अध्याय के पेजों की सामग्री पर आधारित है।</div>
  </section>

  <section class="card result" id="resultCard">
    <div style="font-size:55px">🏆</div>
    <h2>क्विज़ पूरा हुआ!</h2>
    <div class="score" id="finalScore">0/45</div>
    <p id="resultMessage"></p>
    <div class="actions">
      <button class="action" id="restartBtn" onclick="restartQuiz()">🔄 फिर से शुरू करें</button>
    </div>
  </section>
</main>

<script>
const questions = [
{

 a:1,e:"पेज में मृदा को बहुमूल्य प्राकृतिक संसाधन बताया गया है।"

 a:0,e:"मृदा शब्द की उत्पत्ति लैटिन भाषा के ‘Solum’ शब्द से हुई है, जिसका अर्थ फर्श (Floor) है।"
},

 a:1,e:"पेज के अनुसार मृदा विज्ञान में मृदा का निर्माण, वर्गीकरण तथा उसके भौतिक, रासायनिक एवं जैविक गुणों का अध्ययन किया जाता है।"
},
{
 q:"मृदा की उर्वरता (Fertility) का अर्थ क्या है?",

},

let current=0, score=0, answered=false;

const qEl=document.getElementById("question");
const oEl=document.getElementById("options");
const expEl=document.getElementById("explanation");
const nextBtn=document.getElementById("nextBtn");
const countEl=document.getElementById("count");
const scoreEl=document.getElementById("scoreText");
const barEl=document.getElementById("progressBar");

function loadQuestion(){
  answered=false;
  const item=questions[current];
  countEl.textContent=`प्रश्न ${current+1} / ${questions.length}`;
  scoreEl.textContent=`स्कोर: ${score}`;
  barEl.style.width=((current)/questions.length*100)+"%";
  qEl.textContent=item.q;
  oEl.innerHTML="";
  expEl.style.display="none";
  nextBtn.style.display="none";

  item.o.forEach((text,i)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=String.fromCharCode(65+i)+". "+text;
    btn.onclick=()=>selectAnswer(i,btn);
    oEl.appendChild(btn);
  });
}

function selectAnswer(index,clicked){
  if(answered) return;
  answered=true;
  const item=questions[current];
  const buttons=[...document.querySelectorAll(".option")];

  buttons.forEach((b,i)=>{
    b.classList.add("disabled");
    b.onclick=null;
    if(i===item.a) b.classList.add("correct");
  });

  if(index===item.a){
    score++;
    clicked.classList.add("correct");
  }else{
    clicked.classList.add("wrong");
  }

  scoreEl.textContent=`स्कोर: ${score}`;
  expEl.innerHTML="<b>💡 समझिए:</b> "+item.e;
  expEl.style.display="block";
  nextBtn.textContent=current===questions.length-1?"🏆 परिणाम देखें":"अगला प्रश्न ➜";
  nextBtn.style.display="block";
  barEl.style.width=((current+1)/questions.length*100)+"%";
}

function nextQuestion(){
  if(!answered) return;
  current++;
  if(current<questions.length){
    loadQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  }else{
    document.getElementById("quizCard").style.display="none";
    document.getElementById("resultCard").style.display="block";
    document.getElementById("finalScore").textContent=`${score}/${questions.length}`;
    let msg="";
    const pct=score/questions.length*100;
    if(pct>=90) msg="🔥 शानदार! मृदा अध्याय पर आपकी पकड़ बहुत अच्छी है।";
    else if(pct>=70) msg="👏 बहुत अच्छा! थोड़ी और तैयारी से आप और बेहतर कर सकते हैं।";
    else if(pct>=50) msg="👍 अच्छा प्रयास! गलत उत्तरों की व्याख्या दोबारा पढ़ें।";
    else msg="📖 अध्याय को एक बार फिर पढ़कर क्विज़ दोबारा करें।";
    document.getElementById("resultMessage").textContent=msg;
  }
}

function restartQuiz(){
  current=0; score=0;
  document.getElementById("resultCard").style.display="none";
  document.getElementById("quizCard").style.display="block";
  loadQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}

loadQuestion();
